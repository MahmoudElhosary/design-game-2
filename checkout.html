<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bader's World</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&family=Cairo:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1140;--y:#ffc857;--co:#ff4d6d;--pu:#6c3bff;--cr:#fff6e2;--fd:"Baloo Bhaijaan 2","Baloo 2",system-ui,sans-serif;--h:64px;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit;border-radius:0}
html{scroll-padding-top:calc(var(--h) + 24px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--cr);color:var(--ink);font-family:Cairo,system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:500;overflow-x:clip}
[dir=rtl] *{letter-spacing:0!important}
a{color:inherit;text-decoration:none}button,input{font:inherit;color:inherit}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* header */
.hd{position:fixed;z-index:50;top:calc(12px + env(safe-area-inset-top,0px));inset-inline:clamp(12px,2vw,28px);max-width:1400px;margin:0 auto}
.in{height:var(--h);background:#fff;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:0 10px 0 12px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}
.br{display:flex;align-items:center;gap:10px;font:800 21px/1 var(--fd);white-space:nowrap}
.mk{width:38px;height:38px;background:var(--y);border:3px solid var(--ink);display:grid;place-items:center;font:800 17px/1 var(--fd);transform:rotate(-5deg);letter-spacing:-1px}
.nv{display:flex;gap:4px}
.nv a{padding:6px 14px;font:700 17px/1.3 var(--fd);border:2px solid transparent;transition:.15s}
.nv a:hover,.nv a.on{background:var(--y);border-color:var(--ink)}
.ac{display:flex;justify-content:flex-end;align-items:center;gap:6px}
.sr{display:flex;align-items:center;gap:8px;height:42px;width:170px;padding:0 10px;margin-inline-end:6px;background:var(--cr);border:2px solid var(--ink);transition:width .3s,background .2s}
.sr:focus-within{width:240px;background:#fff}
.sr input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:14px;font-weight:600}
.sr input::placeholder{color:#7a7195}
.ib{position:relative;height:42px;min-width:42px;padding:0 8px;display:flex;align-items:center;justify-content:center;gap:6px;background:#fff;border:2px solid transparent;cursor:pointer;transition:.15s}
.ib:hover{background:var(--y);border-color:var(--ink)}
#lgt{font:800 14px/1 var(--fd)}
.cart{background:var(--co);color:#fff;border-color:var(--ink)}.cart:hover{background:var(--pu);color:#fff}
.cb{position:absolute;top:-9px;inset-inline-end:-9px;background:#fff;color:var(--ink);border:2px solid var(--ink);font:800 11px/16px var(--fd);font-style:normal;min-width:20px;text-align:center}
.bg{display:none;background:var(--y);border-color:var(--ink)}.bg span{display:block;width:20px;height:3px;background:var(--ink);margin:3px auto;transition:transform .25s}
.bg.x span:first-child{transform:translateY(3px) rotate(45deg)}.bg.x span:last-child{transform:translateY(-3px) rotate(-45deg)}
.mm{display:none}
/* hero */
.hero{position:relative;height:100vh;height:100svh;min-height:640px;max-height:1100px;overflow:hidden;background:#f6b352}
.vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:60% 40%}
.kb{animation:kb 20s ease-in-out infinite alternate}@keyframes kb{to{transform:scale(1.1)}}
.ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(27,17,64,.4),transparent 48%)}
.sp{position:absolute;z-index:1;color:var(--y);font-size:clamp(22px,3vw,42px);text-shadow:2px 2px 0 var(--ink);animation:fl 4s ease-in-out infinite;pointer-events:none}
@keyframes fl{50%{transform:translateY(-12px) rotate(14deg)}}
.ct{position:absolute;z-index:2;inset:auto 0 52px 0;max-width:1400px;margin:0 auto;padding:0 clamp(16px,3vw,40px) clamp(22px,4vh,46px);display:flex;justify-content:space-between;align-items:flex-end;gap:24px;pointer-events:none}
.ct>*{pointer-events:auto}
.tx{max-width:760px}
h1{margin:0;font:800 clamp(34px,5vw,72px)/1.04 var(--fd);color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink)}
h1 em{font-style:normal;color:var(--y)}
.pp{display:block;width:fit-content;max-width:520px;margin:20px 0 24px;padding:14px 18px;background:var(--cr);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);font-size:15.5px;line-height:1.65;font-weight:600;transform:rotate(-1deg)}
[dir=rtl] .pp{transform:rotate(1deg)}
.bt{display:flex;gap:16px;flex-wrap:wrap}
.b{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:58px;padding:0 30px;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);font:800 20px/1 var(--fd);transition:transform .12s,box-shadow .12s,background .12s}
.b:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
.b:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink)}
.b1{background:var(--y)}.b1:hover{background:#ffd982}
.b2{background:#fff}
.pl{width:28px;height:28px;background:var(--co);border:2px solid var(--ink);display:grid;place-items:center}
.pl svg{width:12px;height:12px;fill:#fff;stroke:none}[dir=rtl] .pl svg{transform:scaleX(-1)}
.sd{display:flex;flex-direction:column;align-items:flex-end;gap:14px}
.pf{display:flex;align-items:center;gap:12px;padding:8px 16px 8px 10px;background:#fff;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);font:700 16px/1.2 var(--fd)}
.av{display:flex}.av i{width:32px;height:32px;border:2px solid var(--ink);display:grid;place-items:center;font:800 14px/1 var(--fd);font-style:normal;margin-inline-start:-8px;background:var(--y)}
.av i:first-child{margin:0}.av i:nth-child(2){background:var(--co);color:#fff}.av i:nth-child(3){background:var(--pu);color:#fff}
.vc{display:flex;gap:8px}
.vc button{width:42px;height:42px;display:grid;place-items:center;background:#fff;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);cursor:pointer}
.vc button:hover{background:var(--y)}
.rb{position:absolute;z-index:3;inset:auto 0 0 0;height:52px;background:var(--ink);border-top:3px solid var(--ink);overflow:hidden;display:flex;align-items:center}
.tr{display:flex;width:max-content;white-space:nowrap;animation:mq 28s linear infinite;color:var(--y);font:800 20px/1 var(--fd)}
.tr span{padding:0 22px}.tr b{color:var(--co)}
@keyframes mq{to{transform:translateX(-50%)}}@keyframes mr{to{transform:translateX(50%)}}
[dir=rtl] .tr{animation-name:mr}
.nx{min-height:60vh;display:grid;place-items:center;text-align:center;padding:40px;color:#7a7195;font-weight:700}
.hero{background:radial-gradient(circle at 32% 46%,#ffe38f,#ffc857 55%,#ffb43a)}.ov{display:none}
[dir=ltr] .hero{background:radial-gradient(circle at 68% 46%,#ffe38f,#ffc857 55%,#ffb43a)}
.art{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.rays{position:absolute;width:220vmax;height:220vmax;left:32%;top:46%;margin:-110vmax 0 0 -110vmax;background:repeating-conic-gradient(rgba(255,255,255,.34) 0 8deg,transparent 8deg 18deg);animation:rot 120s linear infinite}
[dir=ltr] .rays{left:68%}@keyframes rot{to{transform:rotate(360deg)}}
.dots{position:absolute;inset:0;background:radial-gradient(rgba(27,17,64,.16) 2px,transparent 2.5px) 0 0/22px 22px;-webkit-mask-image:linear-gradient(to bottom,#000,transparent 75%);mask-image:linear-gradient(to bottom,#000,transparent 75%)}
.fan{position:absolute;inset-inline-end:clamp(16px,5vw,90px);top:15%;width:min(43vw,600px);height:62%}
.cd{position:absolute;width:26%;aspect-ratio:5/7;background:#fff;border:4px solid var(--ink);box-shadow:8px 8px 0 var(--ink);display:grid;place-items:center;transform:rotate(var(--r));animation:cf 5s ease-in-out infinite}
@keyframes cf{50%{transform:translateY(-14px) rotate(var(--r))}}
.cd:nth-child(2){animation-delay:-1.2s}.cd:nth-child(3){animation-delay:-2.4s}.cd:nth-child(4){animation-delay:-3.6s}
.cd u{position:absolute;top:8px;inset-inline-start:12px;text-decoration:none;font:800 clamp(16px,2vw,28px)/1 var(--fd);color:var(--ink)}
.cd b{font:800 clamp(56px,8vw,128px)/1 var(--fd);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink)}
.cd svg{stroke-width:2.8;filter:drop-shadow(3px 3px 0 var(--ink))}
.bkc{outline:3px dashed rgba(255,255,255,.65);outline-offset:-14px}
.bk{width:52%;aspect-ratio:1;background:var(--y);border:4px solid var(--ink);display:grid;place-items:center;font:800 clamp(22px,3.4vw,52px)/1 var(--fd);transform:rotate(-6deg)}
.die{position:absolute;inset-inline-end:clamp(10px,3vw,60px);top:66%;width:clamp(48px,6vw,84px);aspect-ratio:1;border:4px solid var(--ink);box-shadow:5px 5px 0 var(--ink);transform:rotate(var(--r));animation:cf 6s ease-in-out infinite;
 background:radial-gradient(circle at 26% 26%,var(--ink) 12%,transparent 13%),radial-gradient(circle at 74% 26%,var(--ink) 12%,transparent 13%),radial-gradient(circle at 26% 74%,var(--ink) 12%,transparent 13%),radial-gradient(circle at 74% 74%,var(--ink) 12%,transparent 13%),radial-gradient(circle at 50% 50%,var(--ink) 12%,transparent 13%),#fff}
.cf{position:absolute;width:16px;height:16px;border:3px solid var(--ink);animation:fl 5s ease-in-out infinite}
.cf:nth-of-type(even){animation-delay:-2s;width:12px;height:12px}
.sp{color:#fff}h1 em{color:var(--co)}.tx{max-width:min(700px,54vw)}
@media(max-width:700px){
 .fan{inset-inline:6vw;width:auto;top:calc(var(--h) + 44px);height:30%}
 .cd{width:27%;border-width:3px;box-shadow:5px 5px 0 var(--ink)}.cd b{-webkit-text-stroke:2px var(--ink);text-shadow:3px 3px 0 var(--ink)}
 .die{top:auto;bottom:47%}.tx{max-width:none}
 .rays{left:50%;top:26%}[dir=ltr] .rays{left:50%}
}
html{scroll-behavior:smooth}
.sec{padding:clamp(56px,8vw,100px) clamp(16px,3vw,40px)}.w{max-width:1200px;margin:0 auto}
.stk{background:#fff;color:var(--ink);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink)}
.st{margin:0 0 clamp(28px,4vw,48px);text-align:center;font:800 clamp(30px,4.2vw,54px)/1.3 var(--fd)}
.st em{display:inline-block;font-style:normal;background:var(--y);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:0 14px;transform:rotate(-2deg)}
[dir=rtl] .st em{transform:rotate(2deg)}
#features{background:var(--y);border-block:3px solid var(--ink)}
.fg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:26px}
.fc{padding:28px 22px;text-align:center;transition:.15s}.fc:nth-child(odd){transform:rotate(-1deg)}.fc:nth-child(even){transform:rotate(1deg)}
.fc:hover{transform:translate(-3px,-3px);box-shadow:8px 8px 0 var(--ink)}
.ico{width:72px;height:72px;margin:0 auto 16px;border:3px solid var(--ink);display:grid;place-items:center;background:var(--cr)}.ico svg{width:34px;height:34px}
.fc:nth-child(2) .ico{background:var(--co);color:#fff}.fc:nth-child(3) .ico{background:var(--pu);color:#fff}.fc:nth-child(4) .ico{background:#5be0c2}
.fc h3{margin:0 0 8px;font:800 24px/1.2 var(--fd)}.fc p{margin:0;font-size:14.5px;line-height:1.7;color:#4a4368}
#how{background:var(--cr)}
.hw{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(28px,5vw,64px);align-items:center}
.sl{display:grid;gap:20px}
.stp{display:flex;gap:16px;align-items:flex-start;padding:18px 20px;transition:.15s}.stp:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--ink)}
.no{flex:none;width:46px;height:46px;background:var(--y);border:3px solid var(--ink);display:grid;place-items:center;font:800 24px/1 var(--fd)}
.stp:nth-child(2) .no{background:var(--co);color:#fff}.stp:nth-child(3) .no{background:var(--pu);color:#fff}
.stp h3{margin:0 0 4px;font:800 22px/1.25 var(--fd)}.stp p{margin:0;font-size:14.5px;line-height:1.7;color:#4a4368}
.vd{position:relative;aspect-ratio:4/3;border:3px solid var(--ink);box-shadow:9px 9px 0 var(--ink);background:#000;transform:rotate(-1.5deg)}[dir=rtl] .vd{transform:rotate(1.5deg)}
.vd img{width:100%;height:100%;object-fit:cover;display:block}
.pb{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;background:var(--y);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);display:grid;place-items:center;cursor:pointer;transition:.12s}
.pb:hover{transform:scale(1.08)}.pb svg{width:30px;height:30px;fill:var(--ink);stroke:none}
#shop{background:#fff}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.lk{font:800 19px var(--fd);border-bottom:3px solid var(--y);padding-bottom:2px}.lk:hover{background:var(--y)}
.arr{display:flex;gap:10px}.arr button{width:48px;height:48px;background:#fff;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);cursor:pointer;display:grid;place-items:center;transition:.12s}
.arr button:hover{background:var(--y)}.arr button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
[dir=rtl] .arr svg{transform:scaleX(-1)}
.cr{display:flex;gap:24px;overflow-x:auto;scroll-snap-type:x mandatory;padding:8px 8px 26px;margin:0 -8px;scrollbar-width:none}.cr::-webkit-scrollbar{display:none}
.cr .pc{flex:0 0 min(270px,74%);scroll-snap-align:start}
.pc{display:flex;flex-direction:column;transition:.15s}.pc:hover{transform:translate(-2px,-2px) rotate(-.6deg);box-shadow:8px 8px 0 var(--ink)}
.pim{position:relative;aspect-ratio:4/5;border-bottom:3px solid var(--ink);background:#fff}.pim img{width:100%;height:100%;object-fit:cover;display:block}.pim img.ct2{object-fit:contain}
.bdg{position:absolute;top:10px;inset-inline-start:10px;background:var(--y);border:2px solid var(--ink);padding:1px 10px;font:800 14px/1.5 var(--fd)}.bdg.ex{background:var(--co);color:#fff}
.pim a{display:block;width:100%;height:100%}.pb2 h3 a:hover{background:var(--y)}
.pb2{padding:14px 16px 16px;display:flex;flex-direction:column;flex:1}.pb2 h3{margin:0 0 6px;font:800 21px/1.25 var(--fd)}
.pr{display:flex;align-items:baseline;gap:8px;font:800 21px var(--fd);color:var(--co)}.pr s{color:#8a8299;font-size:15px;font-weight:600}
.adb{margin-top:14px;height:46px;background:var(--y);color:var(--ink);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);font:800 17px var(--fd);cursor:pointer;transition:.12s}
.adb:hover{background:#ffd982}.adb:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
#master{background:radial-gradient(rgba(255,255,255,.18) 2px,transparent 2.5px) 0 0/24px 24px,var(--pu);border-block:3px solid var(--ink);color:#fff}
.ms{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,2fr);gap:clamp(28px,4vw,56px);align-items:center}
.ms h2{margin:0 0 18px;font:800 clamp(30px,3.6vw,48px)/1.2 var(--fd);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink)}

.mg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.mg .pc:nth-child(2){margin-top:22px}.mg .pb2 h3{font-size:18px}
#value{background:var(--cr)}
.vl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(28px,5vw,72px);align-items:center}
.mk2{padding:14px;max-width:440px;transform:rotate(-2deg)}[dir=rtl] .mk2{transform:rotate(2deg)}.mk2 img{width:100%;display:block}
.eb{display:inline-block;background:var(--co);color:#fff;border:3px solid var(--ink);padding:1px 14px;font:800 18px/1.5 var(--fd);margin-bottom:14px;transform:rotate(-2deg)}
.vl h2{margin:0 0 14px;font:800 clamp(28px,3.4vw,44px)/1.3 var(--fd)}.vl p{margin:0 0 26px;font-size:16px;line-height:1.85;color:#4a4368;max-width:520px}
#ig{background:#fff;border-top:3px solid var(--ink)}
.igg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
.igt{display:block;position:relative;aspect-ratio:9/14;background:none center/cover;transition:.15s}
.igt:nth-child(odd){transform:rotate(-1.5deg)}.igt:nth-child(even){transform:rotate(1.5deg)}.igt:hover{transform:translate(-3px,-3px);box-shadow:9px 9px 0 var(--ink)}
.igt i{position:absolute;inset-inline-end:12px;bottom:12px;width:46px;height:46px;background:var(--y);border:3px solid var(--ink);display:grid;place-items:center}
footer{background:var(--ink);color:#fff;padding:clamp(48px,6vw,80px) clamp(16px,3vw,40px) 0}

footer li a{color:#d9d5ee;font-size:15px;transition:.15s}footer li a:hover{color:var(--y)}

.tp{position:fixed;z-index:45;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline-start:20px;width:50px;height:50px;background:var(--y);color:var(--ink);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);display:grid;place-items:center;cursor:pointer;opacity:0;transform:translateY(20px);pointer-events:none;transition:.25s}.tp.show{opacity:1;transform:none;pointer-events:auto}
